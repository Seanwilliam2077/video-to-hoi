<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1060" width="1100" height="1060" role="img" aria-labelledby="title desc">
<title id="title">Video-conditioned pipeline: one joint baseline and bounded repairs</title>
<desc id="desc">Proposed design, October 13, 2026. EpisodeEvidence feeds scale preparation and metric geometry, then one native CARI4D job creates an immutable SceneState. Independent diagnostics generate bounded SolvePlans; every repair creates a new scene. Early export round-trip and quality review are separate release gates. Runtime remains v1 with fake reconstruction stages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="repair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.heading{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#475569}.label{font-size:12px;fill:#475569}.path{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.repair{fill:none;stroke:#b45309;stroke-width:2;marker-end:url(#repair)}</style></defs>
<rect x="1" y="1" width="1098" height="1058" rx="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="43" class="title">From video evidence to one coherent 3D scene</text>
<text x="34" y="70" class="body">Target design · 2026-10-13 · v2 contracts proposed; current main uses v1 fake reconstruction stages</text>
<rect x="330" y="102" width="430" height="60" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="348" y="130" class="heading">Track 1 video + metadata</text>
<text x="348" y="151" class="small">Original frame IDs, timestamps and target identity</text>
<rect x="330" y="196" width="430" height="86" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="348" y="224" class="heading">EpisodeEvidence</text>
<text x="348" y="247" class="body">Observations · visibility · anchors · event candidates</text>
<text x="348" y="269" class="small">Explicit fit/review lineage; missing evidence stays unknown</text>
<rect x="330" y="316" width="430" height="70" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="348" y="344" class="heading">Human + depth scale preparation</text>
<text x="348" y="368" class="small">Camera convention, metric priors and uncertainty</text>
<rect x="330" y="420" width="430" height="70" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="348" y="448" class="heading">Metric object geometry</text>
<text x="348" y="472" class="small">Mesh, origin, symmetry and one constant object scale</text>
<rect x="330" y="524" width="430" height="84" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="348" y="552" class="heading">ONE native CARI4D joint task</text>
<text x="348" y="575" class="body">Coupled human, camera and object trajectories</text>
<text x="348" y="597" class="small">Pin actual consumed inputs; review preparation conflicts</text>
<rect x="330" y="642" width="430" height="86" rx="10" fill="#eef2ff" stroke="#6366f1"/>
<text x="348" y="670" class="heading">Immutable SceneState</text>
<text x="348" y="694" class="body">Native human + camera + mesh/scale + motion/contact</text>
<text x="348" y="716" class="small">All source frames; exact hashes and one scene identity</text>
<rect x="330" y="767" width="430" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
<text x="348" y="795" class="heading">Independent diagnostics + quality review</text>
<text x="348" y="821" class="small">Full-clip checks, events, boundaries and reserved evidence</text>
<rect x="330" y="918" width="430" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
<text x="348" y="946" class="heading">Final release gate</text>
<text x="348" y="970" class="body">Execution + quality + export valid for the same scene</text>
<text x="348" y="991" class="small">Full expected set; frozen policy and restoration record</text>
<path d="M545 162V194" class="path"/>
<path d="M545 282V314" class="path"/>
<path d="M545 386V418" class="path"/>
<path d="M545 490V522" class="path"/>
<path d="M545 608V640" class="path"/>
<path d="M545 728V765" class="path"/>
<path d="M545 841V916" class="path"/>
<text x="555" y="884" class="label">quality accepted</text>
<rect x="30" y="196" width="260" height="148" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="48" y="224" class="heading">Adapt using evidence</text>
<text x="48" y="251" class="body">Thin or symmetric geometry</text>
<text x="48" y="275" class="body">Occlusion and image scale</text>
<text x="48" y="299" class="body">Grasp, slide, roll, foot or seat</text>
<text x="48" y="325" class="small">Multiple contact edges may coexist</text>
<rect x="30" y="376" width="260" height="208" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="48" y="404" class="heading">Four owners, shared state</text>
<text x="48" y="433" class="body">M1 · Evidence, coordinator, export</text>
<text x="48" y="459" class="body">M2 · Native human and scale</text>
<text x="48" y="485" class="body">M3 · Geometry and object motion</text>
<text x="48" y="511" class="body">M4 · Contact and bounded repairs</text>
<text x="48" y="543" class="small">Six stage folders expose views;</text>
<text x="48" y="565" class="small">they do not rerun the joint model.</text>
<rect x="30" y="642" width="260" height="132" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
<text x="48" y="670" class="heading">Early export round-trip</text>
<text x="48" y="696" class="body">Pack → reload → decode/render</text>
<text x="48" y="722" class="small">Start with execution-valid baseline</text>
<text x="48" y="746" class="small">Native units, mesh and frame map</text>
<path d="M330 685H292" class="path"/>
<path d="M160 774V957H328" class="path"/>
<text x="170" y="901" class="label">export valid</text>
<text x="170" y="920" class="label">for same scene</text>
<rect x="804" y="376" width="266" height="208" rx="10" fill="#fff7ed" stroke="#d97706"/>
<text x="822" y="404" class="heading">Global inconsistency</text>
<text x="822" y="432" class="body">Camera, geometry or scale conflict</text>
<text x="822" y="460" class="small">Review and revise preparation.</text>
<text x="822" y="484" class="small">Invalidate dependent artifacts;</text>
<text x="822" y="508" class="small">rerun or explicitly revalidate.</text>
<text x="822" y="549" class="small">Outside the local repair registry.</text>
<path d="M804 453H762" class="repair"/>
<rect x="804" y="642" width="266" height="199" rx="10" fill="#fff7ed" stroke="#d97706"/>
<text x="822" y="670" class="heading">Bounded SolvePlan → repair</text>
<text x="822" y="700" class="body">orientation_branch</text>
<text x="822" y="725" class="body">contact_transition</text>
<text x="822" y="750" class="body">occlusion_recovery</text>
<text x="822" y="780" class="small">Pin parent, evidence, fixed/free blocks,</text>
<text x="822" y="802" class="small">bounds, budget and acceptance policy.</text>
<text x="822" y="826" class="small">Fail/ambiguous → retain parent + logs</text>
<path d="M760 804H802" class="repair"/>
<path d="M804 683H762" class="repair"/>
<text x="805" y="622" class="label">New scene version; never overwrite parent</text>
<rect x="804" y="890" width="266" height="112" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="822" y="918" class="heading">Generalization review</text>
<text x="822" y="944" class="small">30 videos · grouped exposure audit</text>
<text x="822" y="966" class="small">Frozen policy · worst-case regressions</text>
<text x="822" y="988" class="small">No unseen-data claim without history</text>
<text x="34" y="1037" class="small">Design only. Quality review cannot certify hidden-reference 3D accuracy or official scores.</text>
</svg>
