<style>
:root {

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {

    --border: #3d444d; --border-muted: #3d444db3;
    --fg: #f0f6fc; --fg-muted: #9198a1; --link: #4493f8; --neutral-muted: #656c7633;
    --btn-bg: #212830; --focus: #1f6feb; --tab: #f78166;
    --g-thin: #ab7df8; --g-hand: #4493f8; --g-furniture: #d29922; --g-contact: #db61a2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--fg); font: 14px/1.5 var(--font); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 6px; }
code { font-family: var(--mono); font-size: 85%; padding: .2em .4em; border-radius: 6px; background: var(--neutral-muted); overflow-wrap: anywhere; }
svg.oct { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: text-bottom; }
.container { max-width: 1280px; margin: 0 auto; padding-inline: 32px; }

header { background: var(--canvas-subtle); border-bottom: 1px solid var(--border); padding-block: 16px 0; }

.tabline { display: flex; gap: 8px; margin-top: 12px; }
.tabline span { display: inline-flex; gap: 8px; align-items: center; padding: 8px 8px 10px; border-bottom: 2px solid var(--tab); font-weight: 600; }
.counter { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 2em; background: var(--neutral-muted); font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; }
main { padding-block: 24px 48px; }
.intro { max-width: 80ch; color: var(--fg-muted); margin: 0 0 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 16px; color: var(--fg-muted); }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.input { min-height: 32px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--canvas); color: var(--fg); font: 14px/20px var(--font); }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 8px; color: var(--fg-muted); }
.search .input { width: 100%; padding-left: 32px; }
.chipbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chipbar button { border: 1px solid var(--border); background: var(--btn-bg); color: var(--fg); border-radius: 2em; padding: 0 10px; font: 500 12px/24px var(--font); cursor: pointer; }
.chipbar button[aria-pressed="true"] { background: var(--fg); color: var(--canvas); border-color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; background: var(--canvas); }
.media { position: relative; aspect-ratio: 4 / 3; background: var(--canvas-inset); border-bottom: 1px solid var(--border); max-width: 100%; }
.media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .ep { position: absolute; left: 8px; top: 8px; background: #000000b3; color: #fff; font: 600 12px/20px var(--mono); padding: 0 8px; border-radius: 2em; }
.body { padding: 12px 16px 16px; display: grid; gap: 8px; }
.obj { font-weight: 600; font-size: 16px; line-height: 1.3; }
.prompt { color: var(--fg-muted); font-style: italic; overflow-wrap: anywhere; }
.task { font-size: 13px; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--fg-muted); align-items: center; }
.facts span { display: inline-flex; gap: 4px; align-items: center; }
.label { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 2em; font-size: 12px; font-weight: 500; line-height: 20px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--fg); }
.label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.empty { border: 1px solid var(--border); border-radius: 6px; padding: 32px 16px; text-align: center; color: var(--fg-muted); grid-column: 1 / -1; }
footer { border-top: 1px solid var(--border-muted); margin-top: 32px; padding-top: 16px; color: var(--fg-muted); font-size: 12px; }
@media (max-width: 544px) { .crumbs { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
