[project]
name = "cari4d-mhr-windows"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1", "torchvision==0.29.1", "numpy>=2", "scipy", "pillow",
  "opencv-python-headless", "imageio[ffmpeg]", "videoio", "trimesh", "open3d",
  "transformations", "scikit-image", "scikit-learn", "h5py", "hdf5plugin", "joblib",
  "tqdm", "psutil", "pyyaml", "ruamel-yaml", "einops", "kornia", "omegaconf",
  "accelerate", "transformers==5.3.0", "timm", "huggingface-hub", "safetensors",
  "warp-lang", "pytorch3d", "nvdiffrast", "setuptools", "wheel", "ninja", "packaging",
  "v2d-cari4d-lib", "moge", "utils3d", "pytorch-lightning", "yacs", "loguru", "roma",
  "v2d-common[io]", "v2d-mv[math]", "v2d-moge-lib", "v2d-sam3d-body-lib",
  "v2d-foundation-pose-lib", "v2d-mesh-lib",
  "video-to-hoi", "SAM-2", "braceexpand",
]

[dependency-groups]
test = ["pytest"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
no-build-isolation-package = ["pytorch3d", "nvdiffrast", "sam-2"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
video-to-hoi = { path = "../..", editable = true }
sam-2 = { path = "../../third_party/sam2", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
pytorch3d = { path = "../../wheelhouse/windows/pytorch3d-0.7.9-cp312-cp312-win_amd64.whl" }
nvdiffrast = { path = "../../wheelhouse/windows/nvdiffrast-0.4.0-cp312-cp312-win_amd64.whl" }
moge = { path = "../../wheelhouse/windows/moge-2.0.0-py3-none-any.whl" }
utils3d = { path = "../../wheelhouse/windows/utils3d-1.3-py3-none-any.whl" }
v2d-cari4d-lib = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_cari4d/lib", editable = true }
v2d-sam3d-body-lib = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_sam3d_body/lib", editable = true }
v2d-foundation-pose-lib = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_foundation_pose/lib", editable = true }
v2d-moge-lib = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_moge/lib", editable = true }
v2d-mesh-lib = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_mesh/lib", editable = true }
v2d-common = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_common", editable = true }
v2d-mv = { path = "../../third_party/CARI4D_MHR_Win/reconstruction/modules/v2d_mv", editable = true }
