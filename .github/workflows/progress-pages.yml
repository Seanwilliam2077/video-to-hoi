name: Publish progress board

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/progress-pages.yml"
      - "docs/progress-board/**"
      - "docs/track1-videos/index.html"
      - "tracking/**"
      - "tools/progress_board.py"
      - "tests/test_progress_board.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the shared registry and board
        run: |
          python tools/progress_board.py validate
          node --test tests/test_progress_board.cjs
      - name: Assemble the static page
        run: |
          mkdir -p _site
          cp docs/progress-board/index.html docs/progress-board/app.js docs/progress-board/core.js docs/progress-board/style.css _site/
          cp tracking/board.json _site/board.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the progress board
        id: deployment
        uses: actions/deploy-pages@v4
