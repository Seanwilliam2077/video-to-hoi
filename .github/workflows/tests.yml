name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Synthetic CPU fixtures and Track 1 metadata only: no videos, GPU, or model inference.
      # The native-MHR diagnostic scorer tests never load challenge assets.
      # Keep an explicit allowlist; the obsolete legacy scorer suite is removed.
      - run: pip install -e ".[dev,video]"
      - run: >-
          pytest -q
          tests/test_bundle.py
          tests/test_contracts.py
          tests/test_dataset.py
          tests/test_fetch_assets.py
          tests/test_download_foundationpose.py
          tests/test_model_release_prepare.py
          tests/test_model_release_restore.py
          tests/test_handoff_restore.py
          tests/test_benchmark_first3.py
          tests/test_rank_first3.py
          tests/test_geometry.py
          tests/test_metrics.py
          tests/test_track1_score.py
          tests/test_run.py
          tests/test_deliverables.py
          tests/test_delivery_gates.py
          tests/test_v2_artifacts.py
          tests/test_v2_geometry.py
          tests/test_v2_contracts.py
          tests/test_progress_board.py
          tests/test_prepare_track1_data.py
          tests/test_prepare_body_masks.py
          tests/test_prepare_body_camera.py
          tests/test_check_body_handoff.py
          tests/test_package_body_handoff.py
          tests/test_delivery_catalog.py
      - run: python tools/progress_board.py validate
      - run: python tools/build_delivery_catalog.py --check
  progress-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Built-in Node test runner; no npm packages, network fixtures or model data.
      - run: node --test tests/test_progress_board.cjs tests/test_delivery_view.cjs tests/test_progress_app.cjs
