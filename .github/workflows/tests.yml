name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the declared dependencies: no torch, no SOMA-X, no data. Tests that
      # need them skip; the fake pipeline runs end to end into the scorer.
      - run: pip install -e ".[dev]"
      - run: pytest -q
